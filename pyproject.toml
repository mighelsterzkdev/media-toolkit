[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-downloader"
version = "0.1.0"
description = "Download videos and extract MP3 audio from a URL, right in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["yt-dlp[default]>=2025.11.12"]

[project.scripts]
unidown = "universal_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
