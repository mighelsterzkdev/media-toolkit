[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-toolkit"
version = "0.10.1"
description = "Media Toolkit: download media and convert local images, audio, video and animations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["yt-dlp[default]==2026.8.19", "yt-dlp-ejs==0.8.0", "Pillow==12.3.0", "pi-heif==1.4.0"]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]

[project.scripts]
unidown = "universal_downloader.cli:main"

[project.gui-scripts]
media-toolkit = "universal_downloader.gui:main"
unidown-gui = "universal_downloader.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_downloader = ["desktop_assets/*", "desktop_assets/assets/*"]
