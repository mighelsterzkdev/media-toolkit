[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-downloader"
version = "0.6.0"
description = "Download videos, audio, images, and thumbnails from a URL in your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["yt-dlp[default]==2026.8.19", "yt-dlp-ejs==0.8.0", "Pillow==12.3.0"]

[project.scripts]
unidown = "universal_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
