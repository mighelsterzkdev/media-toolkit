name: Build portable Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop-ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: desktop-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Check committed desktop assets match their sources
        run: |
          git diff --exit-code -- ../src/universal_downloader/desktop_assets
          if [ -n "$(git ls-files --others --exclude-standard -- ../src/universal_downloader/desktop_assets)" ]; then
            git ls-files --others --exclude-standard -- ../src/universal_downloader/desktop_assets
            exit 1
          fi
  portable:
    needs: frontend
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B -m pip install -c constraints.txt -e ".[desktop]" pyinstaller==6.22.3
      - run: python -B -m universal_downloader.compatibility
      - run: python -B scripts/install_tools.py
      - run: python -B -m unittest discover -s tests -v
      - run: python -B scripts/build_windows_gui.py
      - name: Check portable executable
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath dist -Directory | Select-Object -First 1
          $executable = Join-Path $bundle.FullName 'unidown.exe'
          python -B scripts/verify_portable.py $executable --bootstrap
          exit $LASTEXITCODE
      - name: Check desktop conversion workers
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath dist -Directory | Select-Object -First 1
          $executable = Join-Path $bundle.FullName 'media-toolkit.exe'
          python -B scripts/verify_desktop.py $executable
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        with:
          name: portable-windows-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      # A version tag publishes the release; the desktop app offers updates only from these.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = python -B -c "import universal_downloader; print(universal_downloader.__version__)"
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match version $version." }
          python -B scripts/release_notes.py $version | Set-Content -Encoding utf8 release-notes.md
          gh release create $env:TAG "dist/media-toolkit-$version-windows-x64.zip" dist/SHA256SUMS.txt --title "Media Toolkit $version" --notes-file release-notes.md
